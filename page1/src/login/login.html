<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cationário</title>

  <!-- Fontes -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Estilos -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="./login.css">
</head>
<body>
  <main class="container">
    <form class="containerForm" id="loginForm">
      <img class="imgCat" src="../img/miaum.jpg"  alt="Gato" />
      <h1 class="title">Cationário</h1>

      <div class="social-icons">
        <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
        <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
      </div>

      <label for="email" class="label">Email</label>
      <input type="email" id="email" class="input" placeholder="Digite seu email" required />

      <label for="password" class="label">Senha</label>
      <input type="password" id="password" class="input" placeholder="Digite sua senha" required />

      <a href="./recover/recover.html" class="recover">Esqueceu a conta?</a>
      <button type="submit" id="loginButton" class="btn">Entrar</button>

      <div class="create">
        <a href="./createAccount/create.html" class="CreateAccount">Não tem uma conta? Criar conta</a>
      </div>
    </form>
  </main>

  <script src="./js/login.js"></script>
</body>
</html>
