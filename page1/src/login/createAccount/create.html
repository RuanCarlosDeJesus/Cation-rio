<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cationário - Criar Conta</title>
  <link rel="stylesheet" href="Create.css" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script> <!-- FontAwesome -->
</head>
<body>
  <form class="containerForm2">
    <img 
      class="imgCat"
      src="../../img/miaum.jpg" 
      alt="Gato" 
    />

    <h1 class="title">Cationário</h1>

    <div class="social-icons">
      <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
      <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
    </div>

    <label for="nome" class="label2">Nome completo</label>
    <input type="text" placeholder="Digite seu nome" class="input2" required />

    <label for="email" class="label2">Digite seu Email</label>
    <input type="email" placeholder="Digite seu Email" class="input2" required />

    <label for="senha" class="label2">Crie sua Senha</label>
    <input type="password" placeholder="Crie sua senha" class="input2" required />

    <button type="submit" class="btnCreate">Criar conta</button>

    <p class="login-link"><a href="index.html">Já tem uma conta?</a></p>
  </form>
</body>
</html>
